<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldBladeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="35%" stop-color="#F2D58A" />
      <stop offset="100%" stop-color="#A68233" />
    </linearGradient>
    <linearGradient id="goldBladeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BE68" />
      <stop offset="50%" stop-color="#B89445" />
      <stop offset="100%" stop-color="#6E5523" />
    </linearGradient>
    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2D58A" />
      <stop offset="50%" stop-color="#FFF5D6" />
      <stop offset="100%" stop-color="#8F6E28" />
    </linearGradient>
  </defs>

  <!-- Dark ornamental backdrop disk for pristine visibility on both dark and light tabs -->
  <circle cx="32" cy="32" r="30" fill="#121310" stroke="#3D321D" stroke-width="1.5" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#C8A65D" stroke-width="0.7" stroke-opacity="0.4" stroke-dasharray="3 2" />

  <!-- Shadow silhouettes for depth without requiring external filter engines -->
  <g transform="translate(0, 1.2)" opacity="0.5">
    <g transform="rotate(-45 32 32)">
      <path d="M32 5 L28.5 13 L28.5 40 L35.5 40 L35.5 13 Z" fill="#000000" />
      <rect x="18" y="39" width="28" height="4" rx="1.5" fill="#000000" />
      <rect x="30" y="42" width="4" height="13" fill="#000000" />
      <circle cx="32" cy="56.5" r="3.5" fill="#000000" />
    </g>
    <g transform="rotate(45 32 32)">
      <path d="M32 5 L28.5 13 L28.5 40 L35.5 40 L35.5 13 Z" fill="#000000" />
      <rect x="18" y="39" width="28" height="4" rx="1.5" fill="#000000" />
      <rect x="30" y="42" width="4" height="13" fill="#000000" />
      <circle cx="32" cy="56.5" r="3.5" fill="#000000" />
    </g>
  </g>

  <!-- Sword 1 (slanted top-right to bottom-left) -->
  <g transform="rotate(-45 32 32)">
    <!-- Left blade edge -->
    <path d="M32 5 L29.5 13 L29.5 39 L32 39 Z" fill="url(#goldBladeL)" />
    <!-- Right blade edge -->
    <path d="M32 5 L34.5 13 L34.5 39 L32 39 Z" fill="url(#goldBladeR)" />
    <!-- Fuller / spine -->
    <line x1="32" y1="6" x2="32" y2="38.5" stroke="#FFF8E7" stroke-width="0.6" stroke-opacity="0.9" />
    <!-- Crossguard -->
    <path d="M19 39.5 C23 39, 27 40.5, 32 40.5 C37 40.5, 41 39, 45 39.5 C45.5 41, 44 42.5, 42 42 C38 41.5, 36 42.5, 32 42.5 C28 42.5, 26 41.5, 22 42 C20 42.5, 18.5 41, 19 39.5 Z" fill="url(#goldHilt)" stroke="#4A3A17" stroke-width="0.5" />
    <!-- Grip -->
    <rect x="30.5" y="42.5" width="3" height="11.5" rx="1" fill="#1C160D" stroke="#A68233" stroke-width="0.5" />
    <line x1="30.5" y1="45.5" x2="33.5" y2="45.5" stroke="#F2D58A" stroke-width="0.6" />
    <line x1="30.5" y1="48.5" x2="33.5" y2="48.5" stroke="#F2D58A" stroke-width="0.6" />
    <line x1="30.5" y1="51.5" x2="33.5" y2="51.5" stroke="#F2D58A" stroke-width="0.6" />
    <!-- Pommel -->
    <circle cx="32" cy="56.5" r="3.2" fill="url(#goldHilt)" stroke="#4A3A17" stroke-width="0.5" />
    <circle cx="32" cy="56.5" r="1.3" fill="#8B1E1E" />
  </g>

  <!-- Sword 2 (slanted top-left to bottom-right) -->
  <g transform="rotate(45 32 32)">
    <!-- Left blade edge -->
    <path d="M32 5 L29.5 13 L29.5 39 L32 39 Z" fill="url(#goldBladeL)" />
    <!-- Right blade edge -->
    <path d="M32 5 L34.5 13 L34.5 39 L32 39 Z" fill="url(#goldBladeR)" />
    <!-- Fuller / spine -->
    <line x1="32" y1="6" x2="32" y2="38.5" stroke="#FFF8E7" stroke-width="0.6" stroke-opacity="0.9" />
    <!-- Crossguard -->
    <path d="M19 39.5 C23 39, 27 40.5, 32 40.5 C37 40.5, 41 39, 45 39.5 C45.5 41, 44 42.5, 42 42 C38 41.5, 36 42.5, 32 42.5 C28 42.5, 26 41.5, 22 42 C20 42.5, 18.5 41, 19 39.5 Z" fill="url(#goldHilt)" stroke="#4A3A17" stroke-width="0.5" />
    <!-- Grip -->
    <rect x="30.5" y="42.5" width="3" height="11.5" rx="1" fill="#1C160D" stroke="#A68233" stroke-width="0.5" />
    <line x1="30.5" y1="45.5" x2="33.5" y2="45.5" stroke="#F2D58A" stroke-width="0.6" />
    <line x1="30.5" y1="48.5" x2="33.5" y2="48.5" stroke="#F2D58A" stroke-width="0.6" />
    <line x1="30.5" y1="51.5" x2="33.5" y2="51.5" stroke="#F2D58A" stroke-width="0.6" />
    <!-- Pommel -->
    <circle cx="32" cy="56.5" r="3.2" fill="url(#goldHilt)" stroke="#4A3A17" stroke-width="0.5" />
    <circle cx="32" cy="56.5" r="1.3" fill="#8B1E1E" />
  </g>

  <!-- Central Boss / Crossing Emblem -->
  <circle cx="32" cy="32" r="3.6" fill="#121310" stroke="#F2D58A" stroke-width="1.2" />
  <circle cx="32" cy="32" r="2" fill="url(#goldBladeL)" />
  <circle cx="32" cy="32" r="0.8" fill="#FFF5D6" />
</svg>